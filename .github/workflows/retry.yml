name: Retry Service CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'retry-service/**'
      - 'shared/**'
      - '.github/workflows/retry-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'retry-service/**'
      - 'shared/**'

env:
  SERVICE_NAME: retry-service
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/retry-service

jobs:
  test:
    name: Test Retry Service
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: retry-service/package-lock.json

      - name: Install dependencies
        working-directory: retry-service
        run: npm ci

      - name: Create test env file
        working-directory: retry-service
        run: |
          cat > .env << EOF
          PORT=5005
          KAFKA_BROKER=localhost:9092
          REDIS_HOST=localhost
          REDIS_PORT=6379
          EOF

      - name: Run tests
        working-directory: retry-service
        run: npm test --if-present

      - name: Run lint
        working-directory: retry-service
        run: npm run lint --if-present

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: retry-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Retry Service
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /app/webhook-platform
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            docker compose up -d --no-deps retry-service
            docker system prune -f
            echo "Retry Service deployed successfully"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sleep 15
            echo "Retry Service is a Kafka consumer - checking process"
            docker compose ps retry-service | grep Up || exit 1
            echo "Retry Service is running"