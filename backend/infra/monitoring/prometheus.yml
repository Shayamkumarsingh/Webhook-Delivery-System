global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:5000"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:5001"]

  - job_name: "webhook-service"
    static_configs:
      - targets: ["webhook-service:5002"]

  - job_name: "event-service"
    static_configs:
      - targets: ["event-service:5003"]

  - job_name: "delivery-service"
    static_configs:
      - targets: ["delivery-service:5004"]

  - job_name: "retry-service"
    static_configs:
      - targets: ["retry-service:5005"]

  - job_name: "dlq-service"
    static_configs:
      - targets: ["dlq-service:5006"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:5007"]